name: ECG QRS Detector CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q qrs_detector.py cli.py agents enrichment.py web/analysis.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check web JavaScript syntax
        run: node --check web/app.js
      - name: Validate container configuration
        run: |
          grep -q 'CMD \["uvicorn"' Dockerfile
          ! grep -Eq 'prod-audit-key|master-audit-key|COPY pyproject.toml' Dockerfile docker-compose.yml
